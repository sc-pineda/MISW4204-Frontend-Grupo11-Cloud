user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 25m;  # task attachments

  upstream api_backend {
    server api:8080;
  }

  server {
    listen 80 default_server;
    server_name _;

    # Reverse-proxy backend API. Same origin → no CORS needed.
    location /api/ {
      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location = /health      { proxy_pass http://api_backend/health; }
    location = /health/ready { proxy_pass http://api_backend/health/ready; }

    # Static frontend: SPA fallback to index.html for Angular client-side routing
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
