# docker-compose for the Compute Engine VM. Runs:
#   - nginx (serves the static frontend bundle and reverse-proxies /api/ to the backend)
#   - api (the Go backend; built from the cloned repo)
#   - postgres (Docker container during dev; swapped for Cloud SQL during sustentación + load tests)
#   - rabbitmq (queue for async report submission)
#
# NOT included on the VM (per Entrega 2 plan):
#   - ollama (RAM budget; the report worker uses a deterministic fallback summary when the AI is unavailable)
#
# Required env vars (set in /opt/app/.env on the VM, NOT committed):
#   JWT_SECRET, GCS_BUCKET_FILES (defaults to miso-494501-files), DATABASE_URL (optional override)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      HTTP_ADDR: ":8080"
      # Default targets the local postgres container. Override via .env to point
      # at Cloud SQL during the sustentación + load tests.
      DATABASE_URL: "${DATABASE_URL:-postgres://app:app@postgres:5432/app?sslmode=disable}"
      JWT_SECRET: "${JWT_SECRET}"
      BROKER_URL: amqp://guest:guest@rabbitmq:5672/
      BROKER_EXCHANGE: reports
      BROKER_QUEUE: reports.weekly.generate
      BROKER_ROUTING_KEY: reports.weekly.generate
      # Cloud Storage (PR #26): backend writes attachments + PDFs to this bucket.
      # ADC works because the VM has the vm-runtime SA attached with storage.objectAdmin.
      STORAGE_PROVIDER: gcs
      GCS_BUCKET: "${GCS_BUCKET:-miso-494501-files}"
      GCS_REPORTS_PREFIX: reports
      # Ollama deliberately unreachable here — RF-14 worker will fail until either a
      # fallback PDF generator lands or Ollama is run on a larger machine for the demo.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
