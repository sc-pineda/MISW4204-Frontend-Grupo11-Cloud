services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "${DATABASE_URL:-postgres://app:app@postgres:5432/app?sslmode=disable}"
      JWT_SECRET: "${JWT_SECRET}"
      BROKER_URL: amqp://guest:guest@rabbitmq:5672/
      BROKER_EXCHANGE: reports
      BROKER_QUEUE: reports.weekly.generate
      BROKER_ROUTING_KEY: reports.weekly.generate
      STORAGE_PROVIDER: gcs
      GCS_BUCKET: "${GCS_BUCKET:-miso-494501-files}"
      GCS_REPORTS_PREFIX: reports
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
