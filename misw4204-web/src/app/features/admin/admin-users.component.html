<h1 class="h4 mb-3">Usuarios</h1>

@if (error()) {
  <div class="alert alert-danger">{{ error() }}</div>
}
@if (success()) {
  <div class="alert alert-success">{{ success() }}</div>
}

<div class="card mb-4">
  <div class="card-header">Crear usuario</div>
  <div class="card-body">
    <form [formGroup]="createForm" (ngSubmit)="createUser()">
      <div class="row g-2">
        <div class="col-md-4">
          <label class="form-label">Nombre</label>
          <input class="form-control" formControlName="name" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Correo</label>
          <input type="email" class="form-control" formControlName="email" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Contraseña (≥ 8)</label>
          <input type="password" class="form-control" formControlName="password" />
        </div>
      </div>
      <div class="mt-3">
        <span class="form-label d-block">Roles</span>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="rAdm" formControlName="administrador" />
          <label class="form-check-label" for="rAdm">administrador</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="rProf" formControlName="profesor" />
          <label class="form-check-label" for="rProf">profesor</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="rMon" formControlName="monitor" />
          <label class="form-check-label" for="rMon">monitor</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="rAsg" formControlName="asistente_graduado" />
          <label class="form-check-label" for="rAsg">asistente_graduado</label>
        </div>
      </div>
      <button type="submit" class="btn btn-primary mt-3" [disabled]="saving()">Guardar</button>
    </form>
  </div>
</div>

@if (loading()) {
  <p class="text-muted">Cargando listado…</p>
} @else {
  <div class="table-responsive">
    <table class="table table-sm table-striped align-middle">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Roles</th>
        </tr>
      </thead>
      <tbody>
        @for (u of users(); track u.id) {
          <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.name }}</td>
            <td>{{ u.email }}</td>
            <td><code class="small">{{ u.roles.join(', ') }}</code></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
